<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>BlinkStudy App Icon - 512x512</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            width: 512px;
            height: 512px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .icon-container {
            width: 512px;
            height: 512px;
            background: linear-gradient(135deg, #E6FFFA 0%, #CCFBF1 50%, #99F6E4 100%);
            border-radius: 115px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        /* Decorative elements */
        .pencil {
            position: absolute;
            top: 40px;
            left: 50px;
            font-size: 40px;
            transform: rotate(-30deg);
        }
        .calculator {
            position: absolute;
            top: 50px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 36px;
        }
        .tablet {
            position: absolute;
            top: 45px;
            right: 55px;
            font-size: 38px;
            transform: rotate(15deg);
        }
        .clock {
            position: absolute;
            right: 50px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 34px;
        }
        .sparkles {
            position: absolute;
            color: #14B8A6;
            font-size: 20px;
        }
        .sparkle1 { top: 100px; left: 100px; }
        .sparkle2 { top: 150px; right: 80px; }
        .sparkle3 { bottom: 130px; left: 70px; }
        .sparkle4 { bottom: 100px; right: 100px; }

        .letters {
            display: flex;
            align-items: flex-end;
            gap: 5px;
            margin-bottom: 15px;
        }

        .letter-b {
            font-family: 'Arial Rounded MT Bold', 'Helvetica Rounded', Arial, sans-serif;
            font-size: 180px;
            font-weight: 900;
            color: #0D9488;
            text-shadow:
                3px 3px 0 #0F766E,
                6px 6px 0 rgba(15, 118, 110, 0.3);
            line-height: 1;
            position: relative;
        }
        .letter-b::after {
            content: '';
            position: absolute;
            top: 20px;
            left: 10px;
            right: 10px;
            height: 40px;
            background: rgba(255,255,255,0.3);
            border-radius: 10px;
            transform: skewY(-5deg);
        }

        .letter-s {
            font-family: 'Arial Rounded MT Bold', 'Helvetica Rounded', Arial, sans-serif;
            font-size: 180px;
            font-weight: 900;
            color: #F59E0B;
            text-shadow:
                3px 3px 0 #D97706,
                6px 6px 0 rgba(217, 119, 6, 0.3);
            line-height: 1;
            position: relative;
        }
        .letter-s::after {
            content: '';
            position: absolute;
            top: 20px;
            left: 10px;
            right: 10px;
            height: 40px;
            background: rgba(255,255,255,0.3);
            border-radius: 10px;
            transform: skewY(-5deg);
        }

        .brand-name {
            font-family: 'Arial Rounded MT Bold', 'Helvetica Rounded', Arial, sans-serif;
            font-size: 48px;
            font-weight: 800;
            margin-top: 5px;
        }
        .brand-name .blink {
            color: #0D9488;
        }
        .brand-name .study {
            color: #F59E0B;
        }

        .shadow-ellipse {
            position: absolute;
            bottom: 80px;
            width: 200px;
            height: 30px;
            background: rgba(13, 148, 136, 0.15);
            border-radius: 50%;
            filter: blur(5px);
        }
    </style>
</head>
<body>
    <div class="icon-container">
        <!-- Decorative Icons -->
        <div class="pencil">✏️</div>
        <div class="calculator">🔢</div>
        <div class="tablet">📱</div>
        <div class="clock">⏰</div>

        <!-- Sparkles -->
        <div class="sparkles sparkle1">✦</div>
        <div class="sparkles sparkle2">✦</div>
        <div class="sparkles sparkle3">✦</div>
        <div class="sparkles sparkle4">✦</div>

        <div class="shadow-ellipse"></div>

        <div class="letters">
            <span class="letter-b">B</span>
            <span class="letter-s">S</span>
        </div>

        <div class="brand-name">
            <span class="blink">Blink</span><span class="study">Study</span>
        </div>
    </div>
</body>
</html>
