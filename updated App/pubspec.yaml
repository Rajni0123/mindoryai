name: blinkstudy
description: BlinkStudy - AI-powered competitive exam preparation platform
publish_to: 'none'
version: 1.4.0+40

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  dio: ^5.4.3
  google_fonts: ^6.3.1
  fl_chart: ^0.68.0
  image_picker: ^1.1.2
  camera: ^0.11.0+1
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.2
  intl: ^0.19.0
  cached_network_image: ^3.3.1
  flutter_markdown: ^0.7.3
  percent_indicator: ^4.2.3
  shimmer: ^3.0.0
  url_launcher: ^6.2.6
  permission_handler: ^11.3.1
  flutter_web_auth_2: ^4.1.0
  google_sign_in: ^6.2.2
  cupertino_icons: ^1.0.8
  flutter_animate: ^4.5.2
  lucide_icons_flutter: ^3.1.14
  speech_to_text: ^7.0.0
  razorpay_flutter: ^1.3.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/logo/
