<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - BlinkStudy</title>
    <link rel="icon" type="image/png" href="./logo.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Inter', sans-serif; }
        body {
            background: #fafafa;
        }
        .page-bg {
            background: radial-gradient(ellipse 60% 80% at 0% 50%, rgba(200, 180, 240, 0.4) 0%, transparent 60%),
                        radial-gradient(ellipse 50% 70% at 100% 60%, rgba(255, 200, 150, 0.4) 0%, transparent 60%);
            min-height: 100vh;
            position: relative;
            z-index: 1;
        }
        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem 2rem;
            max-width: 1200px;
            margin: 0 auto;
        }
        .nav-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 1.25rem;
            color: #0f172a;
            text-decoration: none;
        }
        .nav-logo img { width: 42px; height: 42px; }
        .nav-back {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #64748b;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            padding: 10px 20px;
            border-radius: 50px;
            border: 1px solid #e2e8f0;
            background: rgba(255,255,255,0.8);
            transition: all 0.2s;
        }
        .nav-back:hover { background: #fff; color: #0f172a; }
        .content-card {
            background: rgba(255,255,255,0.95);
            border-radius: 24px;
            padding: 48px;
            box-shadow: 0 4px 30px rgba(0,0,0,0.08);
            border: 1px solid rgba(255,255,255,0.8);
        }
        .form-input {
            width: 100%;
            padding: 14px 18px;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            font-size: 15px;
            transition: all 0.2s;
            background: #fff;
        }
        .form-input:focus {
            outline: none;
            border-color: #1DB9A0;
            box-shadow: 0 0 0 3px rgba(29, 185, 160, 0.1);
        }
        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #374151;
            margin-bottom: 8px;
        }
        .submit-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #1DB9A0, #14b8a6);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(29, 185, 160, 0.3);
        }
        .contact-info {
            background: #f8fafc;
            border-radius: 16px;
            padding: 24px;
        }
        @media (max-width: 768px) {
            .content-card { padding: 24px; }
            .navbar { padding: 1rem; }
            .contact-grid { grid-template-columns: 1fr !important; }
        }
    </style>
</head>
<body>
    <div class="page-bg">
        <!-- Navigation -->
        <nav class="navbar">
            <a href="./index.html" class="nav-logo">
                <img src="./logo.png" alt="BlinkStudy">
                BlinkStudy
            </a>
            <a href="./index.html" class="nav-back">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
                Back to Home
            </a>
        </nav>

        <!-- Main Content -->
        <div style="max-width: 1000px; margin: 0 auto; padding: 40px 24px 80px;">
            <div class="content-card">
                <!-- Header -->
                <div style="text-align: center; margin-bottom: 48px;">
                    <div style="width: 70px; height: 70px; background: linear-gradient(135deg, #1DB9A0, #14b8a6); border-radius: 20px; display: flex; align-items: center; justify-content: center; margin: 0 auto 24px;">
                        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                    </div>
                    <h1 style="font-size: 2.5rem; font-weight: 700; color: #0f172a; margin-bottom: 12px;">Contact Us</h1>
                    <p style="color: #64748b; font-size: 16px; max-width: 500px; margin: 0 auto;">Have questions or feedback? We'd love to hear from you.</p>
                </div>

                <div class="contact-grid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 48px;">
                    <!-- Contact Form -->
                    <div>
                        <form id="contactForm" style="display: flex; flex-direction: column; gap: 20px;">
                            <div>
                                <label class="form-label">Full Name</label>
                                <input type="text" class="form-input" placeholder="Enter your name" required>
                            </div>
                            <div>
                                <label class="form-label">Email Address</label>
                                <input type="email" class="form-input" placeholder="you@example.com" required>
                            </div>
                            <div>
                                <label class="form-label">Mobile Number</label>
                                <input type="tel" class="form-input" placeholder="+91 98765 43210">
                            </div>
                            <div>
                                <label class="form-label">Subject</label>
                                <select class="form-input">
                                    <option value="">Select a topic</option>
                                    <option value="general">General Inquiry</option>
                                    <option value="support">Technical Support</option>
                                    <option value="billing">Billing & Payments</option>
                                    <option value="feedback">Feedback</option>
                                    <option value="partnership">Partnership</option>
                                </select>
                            </div>
                            <div>
                                <label class="form-label">Message</label>
                                <textarea class="form-input" rows="5" placeholder="Tell us how we can help..." required></textarea>
                            </div>
                            <button type="submit" class="submit-btn">
                                Send Message
                            </button>
                        </form>
                    </div>

                    <!-- Contact Info -->
                    <div style="display: flex; flex-direction: column; gap: 20px;">
                        <div class="contact-info">
                            <div style="display: flex; align-items: center; gap: 14px; margin-bottom: 12px;">
                                <div style="width: 44px; height: 44px; background: #DBEAFE; border-radius: 12px; display: flex; align-items: center; justify-content: center;">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#3B82F6" stroke-width="2"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
                                </div>
                                <div>
                                    <h4 style="font-weight: 600; color: #0f172a; margin-bottom: 2px;">Email</h4>
                                    <a href="mailto:support@blinkstudy.in" style="color: #64748b; font-size: 14px; text-decoration: none;">support@blinkstudy.in</a>
                                </div>
                            </div>
                        </div>

                        <div class="contact-info">
                            <div style="display: flex; align-items: center; gap: 14px; margin-bottom: 12px;">
                                <div style="width: 44px; height: 44px; background: #DCFCE7; border-radius: 12px; display: flex; align-items: center; justify-content: center;">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="#22C55E"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
                                </div>
                                <div>
                                    <h4 style="font-weight: 600; color: #0f172a; margin-bottom: 2px;">WhatsApp</h4>
                                    <a href="https://wa.me/919876543210" style="color: #64748b; font-size: 14px; text-decoration: none;">+91 98765 43210</a>
                                </div>
                            </div>
                        </div>

                        <div class="contact-info">
                            <div style="display: flex; align-items: center; gap: 14px; margin-bottom: 12px;">
                                <div style="width: 44px; height: 44px; background: #FEF3C7; border-radius: 12px; display: flex; align-items: center; justify-content: center;">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#F59E0B" stroke-width="2"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
                                </div>
                                <div>
                                    <h4 style="font-weight: 600; color: #0f172a; margin-bottom: 2px;">Location</h4>
                                    <p style="color: #64748b; font-size: 14px;">New Delhi, India</p>
                                </div>
                            </div>
                        </div>

                        <div class="contact-info">
                            <div style="display: flex; align-items: center; gap: 14px;">
                                <div style="width: 44px; height: 44px; background: #EDE9FE; border-radius: 12px; display: flex; align-items: center; justify-content: center;">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#8B5CF6" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                                </div>
                                <div>
                                    <h4 style="font-weight: 600; color: #0f172a; margin-bottom: 2px;">Response Time</h4>
                                    <p style="color: #64748b; font-size: 14px;">Within 24 hours</p>
                                </div>
                            </div>
                        </div>

                        <!-- Social Links -->
                        <div style="margin-top: 20px;">
                            <h4 style="font-weight: 600; color: #0f172a; margin-bottom: 16px;">Follow Us</h4>
                            <div style="display: flex; gap: 12px;">
                                <a href="https://instagram.com/blinkstudy" style="width: 44px; height: 44px; background: #f1f5f9; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #64748b; transition: all 0.2s;">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="20" height="20" x="2" y="2" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" x2="17.51" y1="6.5" y2="6.5"/></svg>
                                </a>
                                <a href="https://twitter.com/blinkstudy" style="width: 44px; height: 44px; background: #f1f5f9; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #64748b; transition: all 0.2s;">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
                                </a>
                                <a href="https://youtube.com/@blinkstudy" style="width: 44px; height: 44px; background: #f1f5f9; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #64748b; transition: all 0.2s;">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M19.615 3.184c-3.604-.246-11.631-.245-15.23 0-3.897.266-4.356 2.62-4.385 8.816.029 6.185.484 8.549 4.385 8.816 3.6.245 11.626.246 15.23 0 3.897-.266 4.356-2.62 4.385-8.816-.029-6.185-.484-8.549-4.385-8.816zm-10.615 12.816v-8l8 3.993-8 4.007z"/></svg>
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <footer style="padding: 24px; text-align: center; color: #64748b; font-size: 13px;">
            <p>© 2024 BlinkStudy. All rights reserved. Made with ❤️ in India</p>
        </footer>
    </div>

    <script>
        document.getElementById('contactForm').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('Thank you for your message! We will get back to you within 24 hours.');
            this.reset();
        });
    </script>
</body>
</html>
