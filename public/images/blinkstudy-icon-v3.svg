<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Premium gradient -->
    <linearGradient id="premiumBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#115E59"/>
      <stop offset="50%" style="stop-color:#0D9488"/>
      <stop offset="100%" style="stop-color:#14B8A6"/>
    </linearGradient>

    <!-- Amber accent -->
    <linearGradient id="amberAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FCD34D"/>
      <stop offset="100%" style="stop-color:#F59E0B"/>
    </linearGradient>

    <!-- Text shadow -->
    <filter id="textShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F766E" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Main background -->
  <rect width="512" height="512" rx="115" fill="url(#premiumBg)"/>

  <!-- Top shine -->
  <ellipse cx="256" cy="80" rx="200" ry="80" fill="rgba(255,255,255,0.12)"/>

  <!-- Geometric accent shapes -->
  <polygon points="450,50 490,150 410,150" fill="#F59E0B" opacity="0.3"/>
  <polygon points="30,400 80,480 -20,480" fill="#99F6E4" opacity="0.2"/>

  <!-- Main letters container -->
  <g filter="url(#textShadow)">
    <!-- Stylized B -->
    <g transform="translate(70, 130)">
      <rect x="0" y="0" width="45" height="250" rx="10" fill="#FFFFFF"/>
      <rect x="45" y="0" width="100" height="45" rx="10" fill="#FFFFFF"/>
      <rect x="45" y="102" width="90" height="45" rx="10" fill="#FFFFFF"/>
      <rect x="45" y="205" width="100" height="45" rx="10" fill="#FFFFFF"/>
      <circle cx="125" cy="60" r="55" fill="none" stroke="#FFFFFF" stroke-width="42"/>
      <circle cx="130" cy="190" r="60" fill="none" stroke="#FFFFFF" stroke-width="42"/>
    </g>

    <!-- Stylized S -->
    <g transform="translate(270, 130)">
      <path d="M170,45 C170,20 145,0 100,0 C55,0 20,25 20,60 C20,95 50,115 100,125 C150,135 170,150 170,185 C170,220 140,250 90,250 C40,250 10,225 10,200"
            fill="none" stroke="url(#amberAccent)" stroke-width="45" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Decorative dots -->
  <circle cx="440" cy="90" r="12" fill="#F59E0B"/>
  <circle cx="460" cy="120" r="6" fill="#FCD34D"/>
  <circle cx="420" cy="70" r="4" fill="#FFFFFF" opacity="0.8"/>
</svg>
