<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Main Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D9488"/>
      <stop offset="100%" style="stop-color:#0F766E"/>
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F59E0B"/>
      <stop offset="100%" style="stop-color:#D97706"/>
    </linearGradient>

    <!-- Light overlay -->
    <linearGradient id="shineGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.2"/>
      <stop offset="50%" style="stop-color:#FFFFFF;stop-opacity:0"/>
    </linearGradient>

    <!-- Shadow filter -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0F766E" flood-opacity="0.3"/>
    </filter>

    <!-- Inner shadow for depth -->
    <filter id="innerGlow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
      <feOffset in="blur" dx="0" dy="2" result="offsetBlur"/>
      <feComposite in="SourceGraphic" in2="offsetBlur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect x="20" y="20" width="472" height="472" rx="100" ry="100" fill="url(#bgGradient)"/>

  <!-- Subtle shine overlay -->
  <rect x="20" y="20" width="472" height="236" rx="100" ry="100" fill="url(#shineGradient)" clip-path="inset(0 0 50% 0)"/>

  <!-- Decorative circles in background -->
  <circle cx="420" cy="120" r="60" fill="#99F6E4" opacity="0.15"/>
  <circle cx="100" cy="400" r="80" fill="#99F6E4" opacity="0.1"/>

  <!-- Letter B -->
  <g filter="url(#dropShadow)">
    <text x="130" y="355" font-family="Arial Black, Arial, sans-serif" font-size="260" font-weight="900" fill="#FFFFFF" letter-spacing="-15">B</text>
  </g>

  <!-- Letter S with accent color -->
  <g filter="url(#dropShadow)">
    <text x="280" y="355" font-family="Arial Black, Arial, sans-serif" font-size="260" font-weight="900" fill="url(#accentGradient)" letter-spacing="-15">S</text>
  </g>

  <!-- Small sparkle/star accent -->
  <g transform="translate(400, 90)">
    <path d="M0,-15 L3,-3 L15,0 L3,3 L0,15 L-3,3 L-15,0 L-3,-3 Z" fill="#F59E0B"/>
  </g>

  <!-- Bottom accent line -->
  <rect x="130" y="380" width="252" height="6" rx="3" fill="url(#accentGradient)" opacity="0.8"/>
</svg>
